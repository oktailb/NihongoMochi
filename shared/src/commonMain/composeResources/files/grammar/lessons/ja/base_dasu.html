<h1>突然の行動: ～です</h1>
<p>接尾語<strong>～します</strong>(次のように書かれています)<strong>～出す</strong>) は動詞に付いて、突然または予期せずに動作が始まったことを表します。</p>
<h2>1. 文章の構造</h2>
<p>添付する<strong>です</strong>に<strong>動詞の語幹</strong>(前の部分<em>～ます</em>）。</p>
<p><strong>[動詞語幹] + どうか</strong></p>
<ul>
<li>
<ruby>急<rt>きゅう</rt></ruby>に<ruby>雨<rt>あめ</rt></ruby>が<strong><ruby>降<rt>ふ</rt></ruby>りだしました</strong>。<br/>（突然、雨が降り始めました。）</li>
<li>
<ruby>赤<rt>あか</rt></ruby>や<strong><ruby>泣<rt>な</rt></ruby>きだした</strong>。<br/>（赤ちゃんは突然泣き始めました。）</li>
<li>みんなが<strong><ruby>笑<rt>わら</rt></ruby>いた</strong>。<br/>（みんな爆笑した。）</li>
</ul>
<h2>2. ニュアンス: 突然性</h2>
<p>に比べ<em>～はじめる</em>（始めに）、<strong>～します</strong>始まりが突然、衝動的、または予期せぬものであったことを強調します。</p>
