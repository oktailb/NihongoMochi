name: nihongo_mochi_flutter
description: A new Flutter project for Nihongo Mochi.
version: 1.0.0+1

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_tts: ^4.2.5
  google_mlkit_digital_ink_recognition: ^0.12.1
  drift: ^2.34.1
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.6
  path: ^1.9.1
  json_annotation: ^4.12.0
  flutter_widget_from_html: ^0.10.6
  google_fonts: ^6.3.3
  provider: ^6.1.5+1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.2
  build_runner: ^2.15.0
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/files/
    - assets/files/kana/
    - assets/files/kanji/
    - assets/files/words/
    - assets/files/grammar/
    - assets/files/grammar/lessons/
    - assets/files/meanings/
    - assets/files/sounds/
    - assets/drawable/
    - assets/values-fr-rFR/
    - assets/values-en-rGB/
    - assets/values/
    - assets/font/

  fonts:
    - family: KanjiStrokeOrders
      fonts:
        - asset: assets/font/KanjiStrokeOrders.ttf
